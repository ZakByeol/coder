<g transform="translate(340,0)">
<rect x="0" y="0" width="400" height="390" fill="#f5f6f8"/>
<text x="20" y="36" font-size="18" font-weight="bold" fill="#222">Red-Black Tree 규칙 검사</text>
<text x="20" y="62" font-size="14" fill="#2f6fde">방금 삽입: 5 (파란 점선)</text>
<rect x="20" y="78" width="360" height="34" rx="6" fill="#1f8a4c"/>
<text x="200" y="100" font-size="15" fill="#fff" font-weight="bold" text-anchor="middle">✔ 모든 규칙 만족</text>
<text x="20" y="142" font-size="15" fill="#1f8a4c" font-weight="bold">✔</text>
<text x="42" y="142" font-size="14" fill="#222">1. 모든 노드는 빨강 또는 검정</text>
<text x="20" y="168" font-size="15" fill="#1f8a4c" font-weight="bold">✔</text>
<text x="42" y="168" font-size="14" fill="#222">2. 루트는 검은색</text>
<text x="20" y="194" font-size="15" fill="#1f8a4c" font-weight="bold">✔</text>
<text x="42" y="194" font-size="14" fill="#222">3. NIL(리프)은 검은색</text>
<text x="20" y="220" font-size="15" fill="#1f8a4c" font-weight="bold">✔</text>
<text x="42" y="220" font-size="14" fill="#222">4. 빨간 노드의 자식은 검은색</text>
<text x="20" y="246" font-size="15" fill="#1f8a4c" font-weight="bold">✔</text>
<text x="42" y="246" font-size="14" fill="#222">5. 모든 경로의 black-height 동일 (bh=2)</text>
<text x="20" y="280" font-size="13" fill="#666">구조 검사</text>
<text x="20" y="304" font-size="15" fill="#1f8a4c" font-weight="bold">✔</text>
<text x="42" y="304" font-size="14" fill="#222">BST 대소관계 유지</text>
<text x="20" y="330" font-size="15" fill="#1f8a4c" font-weight="bold">✔</text>
<text x="42" y="330" font-size="14" fill="#222">child ↔ parent 링크 일치</text>
<text x="20" y="364" font-size="13" fill="#666">삽입 순서</text>
<text x="20" y="384" font-size="13" fill="#222">40 → 20 → 60 → 80 → 10 → 5</text>
</g>
